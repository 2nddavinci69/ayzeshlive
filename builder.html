<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AYZESHLIVE Builder — Image + MP4 & .mind Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f19;
      color: #ffffff;
    }
    .header {
      position: sticky;
      top: 0;
      background: #000000;
      border-bottom: 2px solid #ff6b00;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 900;
      color: #ff6b00;
      letter-spacing: 1.5px;
    }
    .back-link {
      color: #000;
      background: #ff6b00;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 800;
      font-size: 13px;
    }
    .container {
      max-width: 820px;
      margin: 24px auto;
      padding: 0 16px 40px;
    }
    .card {
      background: #141b2d;
      border: 1px solid #263147;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 {
      margin-top: 0;
      color: #ff6b00;
      font-size: 18px;
    }
    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600;
      font-size: 14px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #0b0f19;
      color: #fff;
      box-sizing: border-box;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .preview-box {
      background: #0b0f19;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .preview-box img, .preview-box video {
      max-width: 100%;
      max-height: 220px;
      border-radius: 8px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    button {
      background: linear-gradient(135deg, #ff6b00, #e65100);
      color: #000000;
      font-weight: 800;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    button.secondary {
      background: #1f2937;
      color: #ffffff;
      border: 1px solid #ff6b00;
    }
    .log-box {
      margin-top: 14px;
      background: #0b0f19;
      border-left: 3px solid #ff6b00;
      padding: 12px;
      font-size: 13px;
      color: #d1d5db;
      white-space: pre-wrap;
    }
    #qrBox {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      background: #ffffff;
      padding: 14px;
      border-radius: 12px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-text">AYZESHLIVE BUILDER</div>
    <a href="./index.html" class="back-link">📷 Open Scanner</a>
  </header>

  <div class="container">
    <div class="card">
      <h2>1. Image + MP4 Video Jorain (Pair & Preview)</h2>

      <label>Project / Target Name</label>
      <input type="text" id="projectName" placeholder="e.g. AYZESH-CARD-01" value="AYZESH-LIVE-01" />

      <label>Select Target Image (JPG / PNG — high detail works best for tracking)</label>
      <input type="file" id="imageInput" accept="image/*" onchange="handleImageChange(event)" />

      <label>Select Video File (MP4)</label>
      <input type="file" id="videoInput" accept="video/mp4,video/*" onchange="handleVideoChange(event)" />

      <label>Hosted MP4 Video URL (Optional — for direct QR/AR link after uploading to GitHub/Host)</label>
      <input type="text" id="hostedVideoUrl" placeholder="https://2nddavinci69.github.io/ayzeshlive/assets/demo.mp4" />

      <div class="preview-grid">
        <div class="preview-box">
          <div style="font-size:12px; color:#9ca3af; margin-bottom:8px;">Target Image Preview</div>
          <img id="imgPreview" alt="Image preview" style="display:none;" />
          <p id="imgPlaceholder" style="color:#6b7280; font-size:13px;">No image selected</p>
        </div>
        <div class="preview-box">
          <div style="font-size:12px; color:#9ca3af; margin-bottom:8px;">MP4 Video Preview</div>
          <video id="vidPreview" controls style="display:none;"></video>
          <p id="vidPlaceholder" style="color:#6b7280; font-size:13px;">No video selected</p>
        </div>
      </div>

      <div class="btn-row">
        <button onclick="compileMindFile()">⚙️ Compile & Download targets.mind</button>
        <button class="secondary" onclick="downloadPairBundle()">📦 Download Pair Config (.json)</button>
        <button class="secondary" onclick="generateQR()">🔳 Generate Direct QR Code</button>
      </div>

      <div class="log-box" id="logBox">Ready. Select an image and an MP4 video to begin.</div>
    </div>

    <div class="card" style="text-align:center;">
      <h2>2. Direct QR Code</h2>
      <p style="font-size:13px; color:#9ca3af;">Scan this QR code to open the AYZESHLIVE viewer directly.</p>
      <div id="qrBox"></div>
      <p id="shareUrlText" style="font-size:12px; color:#ff6b00; word-break:break-all; margin-top:12px;"></p>
    </div>
  </div>

  <script>
    let loadedImageEl = null;
    let videoFileName = 'demo.mp4';
    let imageFileName = 'target.jpg';

    const logBox = document.getElementById('logBox');
    function log(msg) {
      logBox.innerText = msg;
    }

    function handleImageChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      imageFileName = file.name;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        loadedImageEl = img;
        const preview = document.getElementById('imgPreview');
        preview.src = url;
        preview.style.display = 'inline-block';
        document.getElementById('imgPlaceholder').style.display = 'none';
        log(`Image loaded (${img.width}x${img.height}). You can now compile targets.mind.`);
      };
      img.src = url;
    }

    function handleVideoChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      videoFileName = file.name;
      const url = URL.createObjectURL(file);
      const vid = document.getElementById('vidPreview');
      vid.src = url;
      vid.style.display = 'inline-block';
      document.getElementById('vidPlaceholder').style.display = 'none';
      log(`Video loaded: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB).`);
    }

    async function loadMindCompilerClass() {
      if (window.MINDAR?.IMAGE?.Compiler) {
        return window.MINDAR.IMAGE.Compiler;
      }
      const sources = [
        'https://esm.sh/mind-ar@1.2.5/dist/mindar-image-target.prod.js',
        'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-target.prod.js'
      ];
      for (const src of sources) {
        try {
          const mod = await import(/* @vite-ignore */ src);
          if (mod?.Compiler) return mod.Compiler;
          if (window.MINDAR?.IMAGE?.Compiler) return window.MINDAR.IMAGE.Compiler;
        } catch (_) {}
      }
      return null;
    }

    function getResizedCanvasImage(img, maxSide = 800) {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(64, Math.round(img.width * scale));
      canvas.height = Math.max(64, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      return canvas;
    }

    async function compileMindFile() {
      if (!loadedImageEl) {
        alert('Please select a target image first.');
        return;
      }

      log('Loading MindAR Compiler module...');
      const CompilerClass = await loadMindCompilerClass();
      if (!CompilerClass) {
        log('Could not load MindAR Compiler module from CDN. Check network/adblock or use Download Pair Config (.json) for now.');
        return;
      }

      try {
        const targetCanvas = getResizedCanvasImage(loadedImageEl, 800);
        log(`Compiling .mind tracking data (${targetCanvas.width}x${targetCanvas.height})...`);
        const compiler = new CompilerClass();
        await compiler.compileImageTargets([targetCanvas], (progress) => {
          log(`Compiling target features: ${Math.round(progress)}%`);
        });
        const exportedBuffer = await compiler.exportData();
        const blob = new Blob([exportedBuffer], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'targets.mind';
        link.click();
        log('Success! Downloaded targets.mind. Upload it to ./assets/targets.mind on GitHub.');
      } catch (err) {
        log('Compilation error: ' + (err?.message || err));
      }
    }

    function downloadPairBundle() {
      const projectName = document.getElementById('projectName').value.trim() || 'AYZESH-LIVE-01';
      const hostedVideo = document.getElementById('hostedVideoUrl').value.trim() || `./assets/${videoFileName}`;
      const bundle = {
        brand: 'AYZESHLIVE',
        projectName,
        targetFile: './assets/targets.mind',
        sourceImage: imageFileName,
        videoFile: videoFileName,
        videoUrl: hostedVideo,
        createdAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${projectName.toLowerCase()}-pair.json`;
      a.click();
      log('Pair JSON downloaded.');
    }

    function generateQR() {
      const qrBox = document.getElementById('qrBox');
      qrBox.innerHTML = '';
      const baseUrl = window.location.href.replace(/builder\.html.*$/, 'index.html');
      const customVideo = document.getElementById('hostedVideoUrl').value.trim();
      const finalUrl = customVideo ? `${baseUrl}?video=${encodeURIComponent(customVideo)}` : baseUrl;

      new QRCode(qrBox, {
        text: finalUrl,
        width: 190,
        height: 190
      });
      document.getElementById('shareUrlText').innerText = finalUrl;
      log('QR Code generated for: ' + finalUrl);
    }
  </script>
</body>
</html>
