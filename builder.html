<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYZESHLIVE — AR Player & QR Builder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Locked Top Bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      padding: 0 20px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0b1120;
      font-weight: 900;
      font-size: 0.95rem;
      display: grid;
      place-items: center;
      letter-spacing: 0.03em;
    }
    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #f8fafc;
    }
    .brand-tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Main Non-Scrolling Workspace */
    .workspace {
      position: fixed;
      top: 58px;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .card {
      width: 100%;
      max-width: 470px;
      background: #172033;
      border: 1px solid #2b384e;
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 0.88rem;
      font-weight: 700;
      color: #e2e8f0;
    }
    .field-label code {
      color: #f8fafc;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.84rem;
    }

    .file-box, .url-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px 10px;
      color: #cbd5e1;
      font-size: 0.84rem;
    }
    .file-box::file-selector-button {
      background: #e2e8f0;
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      margin-right: 10px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .url-box {
      padding: 9px 12px;
      outline: none;
      color: #f8fafc;
    }
    .url-box:focus {
      border-color: #f59e0b;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #f59e0b;
      color: #0b1120;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.28);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .btn-primary:hover { background: #fbbf24; }
    .btn-primary:active { transform: scale(0.99); }

    /* QR Section */
    .qr-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .qr-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .qr-actions {
      display: flex;
      gap: 6px;
    }
    .btn-sm {
      padding: 6px 10px;
      border-radius: 7px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-sm.accent {
      background: rgba(245, 158, 11, 0.16);
      border-color: #f59e0b;
      color: #fbbf24;
    }
    .qr-preview {
      width: 78px;
      height: 78px;
      background: #ffffff;
      border-radius: 8px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-line {
      font-size: 0.76rem;
      color: #38bdf8;
      min-height: 16px;
      text-align: center;
    }

    .card-footer {
      border-top: 1px solid #2b384e;
      padding-top: 10px;
      text-align: center;
      font-size: 0.74rem;
      line-height: 1.45;
      color: #94a3b8;
    }
    .card-footer strong {
      color: #f59e0b;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-badge">AL</div>
      <div class="brand-name">AYZESHLIVE</div>
    </div>
    <div class="brand-tag">AR BUILDER &amp; QR</div>
  </header>

  <main class="workspace">
    <section class="card">
      <div class="field-group">
        <label class="field-label" for="mindInput">Upload <code>.mind</code> tracking file:</label>
        <input id="mindInput" class="file-box" type="file" accept=".mind" />
      </div>

      <div class="field-group">
        <label class="field-label" for="videoInput">Upload client video (<code>.mp4</code>):</label>
        <input id="videoInput" class="file-box" type="file" accept="video/mp4,.mp4" />
      </div>

      <button id="generateBtn" class="btn-primary" type="button">Generate AR Player File</button>

      <div class="qr-panel">
        <div class="qr-controls">
          <label class="field-label" for="liveUrlInput" style="font-size:0.8rem;">Live AR Link for QR Code:</label>
          <input
            id="liveUrlInput"
            class="url-box"
            type="url"
            value="https://ayzeshlive.com/"
            placeholder="https://ayzeshlive.com/client-ar/"
          />
          <div class="qr-actions">
            <button id="qrGenBtn" class="btn-sm accent" type="button">Generate QR</button>
            <button id="qrDownloadBtn" class="btn-sm" type="button">Download QR</button>
          </div>
        </div>
        <div id="qrBox" class="qr-preview" title="AYZESHLIVE QR Code"></div>
      </div>

      <div id="statusMsg" class="status-line"></div>

      <footer class="card-footer">
        <div>Founder / Owner: <strong>Mushtaque Ahmed Rajput</strong> | Contact: <strong>0321-2100966</strong></div>
        <div>&copy; 2026 AYZESHLIVE. All Rights Reserved.</div>
      </footer>
    </section>
  </main>

  <script>
    const mindInput = document.getElementById("mindInput");
    const videoInput = document.getElementById("videoInput");
    const generateBtn = document.getElementById("generateBtn");
    const liveUrlInput = document.getElementById("liveUrlInput");
    const qrGenBtn = document.getElementById("qrGenBtn");
    const qrDownloadBtn = document.getElementById("qrDownloadBtn");
    const qrBox = document.getElementById("qrBox");
    const statusMsg = document.getElementById("statusMsg");

    function renderQR() {
      const link = (liveUrlInput.value || "").trim() || "https://ayzeshlive.com/";
      qrBox.innerHTML = "";
      new QRCode(qrBox, {
        text: link,
        width: 70,
        height: 70,
        colorDark: "#0b1120",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    qrGenBtn.addEventListener("click", () => {
      renderQR();
      statusMsg.textContent = "QR Code updated for AYZESHLIVE link.";
    });

    qrDownloadBtn.addEventListener("click", () => {
      const canvas = qrBox.querySelector("canvas");
      const img = qrBox.querySelector("img");
      const dataUrl = canvas ? canvas.toDataURL("image/png") : (img ? img.src : "");
      if (!dataUrl) return;
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = "AYZESHLIVE-QR.png";
      a.click();
      statusMsg.textContent = "AYZESHLIVE-QR.png downloaded.";
    });

    generateBtn.addEventListener("click", () => {
      const mindFile = mindInput.files[0];
      const videoFile = videoInput.files[0];

      if (!mindFile || !videoFile) {
        statusMsg.textContent = "Please select both .mind and .mp4 files first.";
        return;
      }

      const mindFileName = mindFile.name;
      const videoFileName = videoFile.name;

      const playerHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYZESHLIVE — Live AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"><\/script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"><\/script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1120; font-family: system-ui, sans-serif; color: #fff; }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 56px; padding: 0 16px;
      background: rgba(15, 23, 42, 0.92); border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: space-between; z-index: 30;
    }
    .brand { font-size: 1.05rem; font-weight: 800; letter-spacing: 0.08em; color: #f59e0b; }
    .status { font-size: 0.75rem; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.1); }
    .ar-wrap { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; }
    .sound-btn {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 30;
      display: none; padding: 10px 18px; border: none; border-radius: 999px;
      background: #f59e0b; color: #0b1120; font-weight: 800; font-size: 0.86rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">AYZESHLIVE</div>
    <div id="statusBadge" class="status">Starting camera...</div>
  </header>
  <main class="ar-wrap">
    <a-scene
      id="scene"
      mindar-image="imageTargetSrc: ./assets/${mindFileName}; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="arVid" src="./assets/${videoFileName}" preload="auto" loop="true" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <a-video src="#arVid" position="0 0 0" width="1" height="0.5625"></a-video>
      </a-entity>
    </a-scene>
  </main>
  <button id="soundBtn" class="sound-btn" type="button">Tap for Sound</button>
  <script>
    const scene = document.getElementById("scene");
    const arVid = document.getElementById("arVid");
    const target0 = document.getElementById("target0");
    const statusBadge = document.getElementById("statusBadge");
    const soundBtn = document.getElementById("soundBtn");

    scene.addEventListener("arReady", () => { statusBadge.textContent = "Scan target image"; });
    scene.addEventListener("arError", () => { statusBadge.textContent = "Camera error"; });
    target0.addEventListener("targetFound", () => {
      statusBadge.textContent = "AYZESHLIVE Playing";
      arVid.muted = true;
      arVid.play().catch(() => {});
      soundBtn.style.display = "block";
    });
    target0.addEventListener("targetLost", () => {
      statusBadge.textContent = "Scan target image";
      arVid.pause();
      soundBtn.style.display = "none";
    });
    soundBtn.addEventListener("click", () => {
      arVid.muted = !arVid.muted;
      arVid.play().catch(() => {});
      soundBtn.textContent = arVid.muted ? "Tap for Sound" : "Mute Sound";
    });
  <\/script>
</body>
</html>`;

      const blob = new Blob([playerHtml], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "index.html";
      link.click();
      URL.revokeObjectURL(url);

      statusMsg.textContent = `Generated index.html for ${mindFileName} + ${videoFileName}!`;
    });

    // Initial default QR render
    renderQR();
  </script>
</body>
</html>
