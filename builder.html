<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYZESHLIVE — AR &amp; .mind Builder</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06090f;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Locked Top Bar matching Main Scanner */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 62px;
      padding: 0 20px;
      background: #0b111e;
      border-bottom: 1px solid #ea580c;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .logo-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      border: 2px solid #f97316;
      background: rgba(249, 115, 22, 0.1);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .logo-icon svg {
      width: 22px;
      height: 22px;
      stroke: #fb923c;
      fill: none;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    .brand-title {
      font-size: 1.08rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #f97316;
    }
    .brand-sub {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .nav-link {
      padding: 8px 14px;
      border-radius: 8px;
      background: #f97316;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
    }
    .nav-link:hover { background: #fb923c; }

    /* Non-Scrolling Compact Workspace */
    .stage {
      position: fixed;
      top: 62px;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      width: 100%;
      max-width: 820px;
      background: #0b111e;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
    }
    .col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .box-card {
      background: #06090f;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #e2e8f0;
    }
    .label code {
      color: #fb923c;
      font-family: ui-monospace, monospace;
    }
    .mini-link {
      font-size: 0.7rem;
      color: #94a3b8;
      text-decoration: underline;
    }
    .mini-link:hover { color: #fb923c; }

    input[type="file"], input[type="url"] {
      width: 100%;
      background: #0b111e;
      border: 1px solid #263349;
      border-radius: 8px;
      padding: 7px 9px;
      color: #f8fafc;
      font-size: 0.78rem;
    }
    input[type="file"]::file-selector-button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 8px;
      margin-right: 8px;
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #0b111e;
      border: 1px solid #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: #f97316;
      transition: width 0.15s ease;
    }

    .btn-orange {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #f97316;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-orange:hover { background: #fb923c; }
    .btn-orange:disabled { opacity: 0.55; cursor: not-allowed; }

    .btn-dark {
      padding: 7px 11px;
      border-radius: 7px;
      border: 1px solid #334155;
      background: #111827;
      color: #f8fafc;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-dark.outline-orange {
      border-color: #f97316;
      color: #fb923c;
    }

    .qr-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .qr-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .qr-box {
      width: 78px;
      height: 78px;
      background: #ffffff;
      border-radius: 8px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .full-span {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
      font-size: 0.73rem;
      color: #94a3b8;
    }
    .status-txt { color: #fb923c; font-weight: 600; }
    .owner-txt strong { color: #f97316; }

    @media (max-width: 740px) {
      html, body { overflow: auto; }
      .stage { position: static; height: auto; min-height: calc(100vh - 62px); margin-top: 62px; }
      .panel { grid-template-columns: 1fr; }
      .full-span { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand-box" href="./">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 4L5 20h3.2l1.6-4h4.4l1.6 4H19L12 4zm0 5.4l1.4 3.8h-2.8L12 9.4z"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">AYZESHLIVE</span>
        <span class="brand-sub">SCAN &amp; PLAY AR</span>
      </div>
    </a>
    <a class="nav-link" href="./">Scanner</a>
  </header>

  <main class="stage">
    <section class="panel">
      <!-- Left Column: 1) Built-in MindAR Compiler + 2) AR Player Generator -->
      <div class="col">
        <div class="box-card">
          <div class="box-head">
            <label class="label" for="imgTargetInput">1. MindAR Compiler (<code>.png/.jpg → .mind</code>):</label>
            <a class="mini-link" href="https://hiukim.github.io/mind-ar-js-doc/tools/compile" target="_blank" rel="noopener noreferrer">Official Tool</a>
          </div>
          <input id="imgTargetInput" type="file" accept="image/png,image/jpeg,image/webp" multiple />
          <div class="progress-track"><div id="compileBar" class="progress-fill"></div></div>
          <button id="compileMindBtn" class="btn-orange" type="button">Compile &amp; Download targets.mind</button>
        </div>

        <div class="box-card">
          <label class="label" for="mindInput">2. Upload <code>.mind</code> tracking file:</label>
          <input id="mindInput" type="file" accept=".mind" />
          <label class="label" for="videoInput">Upload client video (<code>.mp4</code>):</label>
          <input id="videoInput" type="file" accept="video/mp4,.mp4" />
          <button id="genPlayerBtn" class="btn-orange" type="button">Generate AR Player File</button>
        </div>
      </div>

      <!-- Right Column: 3) Live AR Link & QR Code Generator -->
      <div class="col">
        <div class="box-card" style="height: 100%; justify-content: space-between;">
          <div style="display:flex; flex-direction:column; gap:8px;">
            <label class="label" for="qrLinkInput">3. Live AR Link for QR Code:</label>
            <input id="qrLinkInput" type="url" value="https://2nddavinci69.github.io/ayzeshlive/" />
          </div>

          <div class="qr-row">
            <div>
              <div class="label" style="font-size:0.76rem; color:#94a3b8;">Scan &amp; Print Ready QR</div>
              <div class="qr-actions">
                <button id="genQrBtn" class="btn-dark outline-orange" type="button">Generate QR</button>
                <button id="dlQrBtn" class="btn-dark" type="button">Download QR</button>
              </div>
            </div>
            <div id="qrBox" class="qr-box"></div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="full-span">
        <div id="statusMsg" class="status-txt">Ready — AYZESHLIVE AR Suite</div>
        <div class="owner-txt">
          Founder / Owner: <strong>Mushtaque Ahmed Rajput</strong> | Contact: <strong>0321-2100966</strong> | &copy; 2026 AYZESHLIVE
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { Compiler } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js";

    const imgTargetInput = document.getElementById("imgTargetInput");
    const compileMindBtn = document.getElementById("compileMindBtn");
    const compileBar = document.getElementById("compileBar");
    const mindInput = document.getElementById("mindInput");
    const videoInput = document.getElementById("videoInput");
    const genPlayerBtn = document.getElementById("genPlayerBtn");
    const qrLinkInput = document.getElementById("qrLinkInput");
    const genQrBtn = document.getElementById("genQrBtn");
    const dlQrBtn = document.getElementById("dlQrBtn");
    const qrBox = document.getElementById("qrBox");
    const statusMsg = document.getElementById("statusMsg");

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Invalid image file"));
          img.src = reader.result;
        };
        reader.onerror = () => reject(new Error("Could not read file"));
        reader.readAsDataURL(file);
      });
    }

    compileMindBtn.addEventListener("click", async () => {
      const files = Array.from(imgTargetInput.files || []);
      if (!files.length) {
        statusMsg.textContent = "Select at least one clear target image (.png / .jpg) first.";
        return;
      }

      compileMindBtn.disabled = true;
      compileBar.style.width = "5%";
      statusMsg.textContent = "Loading target image(s)...";

      try {
        const images = await Promise.all(files.map(loadImage));
        const compiler = new Compiler();

        await compiler.compileImageTargets(images, (progress) => {
          const pct = Math.max(5, Math.min(100, Math.round(progress)));
          compileBar.style.width = pct + "%";
          statusMsg.textContent = `Compiling targets.mind: ${pct}%`;
        });

        const exportedBuffer = await compiler.exportData();
        const blob = new Blob([exportedBuffer], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "targets.mind";
        a.click();
        URL.revokeObjectURL(url);

        compileBar.style.width = "100%";
        statusMsg.textContent = "Success! targets.mind compiled & downloaded.";
      } catch (err) {
        compileBar.style.width = "0%";
        statusMsg.textContent = `Compiler error: ${err.message || "Try a clearer high-contrast image."}`;
        console.error(err);
      } finally {
        compileMindBtn.disabled = false;
      }
    });

    genPlayerBtn.addEventListener("click", () => {
      const mindFile = mindInput.files[0];
      const videoFile = videoInput.files[0];
      if (!mindFile || !videoFile) {
        statusMsg.textContent = "Please choose both .mind and .mp4 files.";
        return;
      }

      const mindName = mindFile.name;
      const vidName = videoFile.name;

      const htmlOut = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYZESHLIVE — Scan &amp; Play AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"><\/script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"><\/script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06090f; color: #f8fafc; font-family: system-ui, sans-serif; }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 62px; padding: 0 20px;
      background: #0b111e; border-bottom: 1px solid #ea580c;
      display: flex; align-items: center; justify-content: space-between; z-index: 30;
    }
    .brand { font-size: 1.08rem; font-weight: 800; letter-spacing: 0.06em; color: #f97316; }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: rgba(249,115,22,0.16); color: #fb923c; }
    .ar-stage { position: fixed; top: 62px; left: 0; right: 0; bottom: 0; }
    .sound-btn {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 30;
      display: none; padding: 10px 18px; border: none; border-radius: 8px;
      background: #f97316; color: #fff; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">AYZESHLIVE</div>
    <div id="statusBadge" class="badge">Starting camera...</div>
  </header>
  <main class="ar-stage">
    <a-scene
      id="scene"
      mindar-image="imageTargetSrc: ./assets/${mindName}; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video id="vid0" src="./assets/${vidName}" preload="auto" loop="true" muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="t0" mindar-image-target="targetIndex: 0">
        <a-video src="#vid0" position="0 0 0" width="1" height="0.5625"></a-video>
      </a-entity>
    </a-scene>
  </main>
  <button id="soundBtn" class="sound-btn" type="button">Unmute</button>
  <script>
    const scene = document.getElementById("scene");
    const vid0 = document.getElementById("vid0");
    const t0 = document.getElementById("t0");
    const statusBadge = document.getElementById("statusBadge");
    const soundBtn = document.getElementById("soundBtn");
    scene.addEventListener("arReady", () => { statusBadge.textContent = "Scan target image"; });
    scene.addEventListener("arError", () => { statusBadge.textContent = "Camera error"; });
    t0.addEventListener("targetFound", () => {
      statusBadge.textContent = "Playing";
      vid0.muted = true;
      vid0.play().catch(() => {});
      soundBtn.style.display = "block";
    });
    t0.addEventListener("targetLost", () => {
      statusBadge.textContent = "Scan target image";
      vid0.pause();
      soundBtn.style.display = "none";
    });
    soundBtn.addEventListener("click", () => {
      vid0.muted = !vid0.muted;
      vid0.play().catch(() => {});
      soundBtn.textContent = vid0.muted ? "Unmute" : "Mute";
    });
  <\/script>
</body>
</html>`;

      const blob = new Blob([htmlOut], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      a.click();
      URL.revokeObjectURL(url);
      statusMsg.textContent = `Generated index.html (${mindName} + ${vidName}).`;
    });

    function drawQR() {
      const val = (qrLinkInput.value || "").trim() || "https://2nddavinci69.github.io/ayzeshlive/";
      qrBox.innerHTML = "";
      new QRCode(qrBox, {
        text: val,
        width: 70,
        height: 70,
        colorDark: "#06090f",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    genQrBtn.addEventListener("click", () => {
      drawQR();
      statusMsg.textContent = "QR Code updated.";
    });

    dlQrBtn.addEventListener("click", () => {
      const canvas = qrBox.querySelector("canvas");
      const img = qrBox.querySelector("img");
      const src = canvas ? canvas.toDataURL("image/png") : (img ? img.src : "");
      if (!src) return;
      const a = document.createElement("a");
      a.href = src;
      a.download = "AYZESHLIVE-QR.png";
      a.click();
      statusMsg.textContent = "Downloaded AYZESHLIVE-QR.png";
    });

    drawQR();
  </script>
</body>
</html>
