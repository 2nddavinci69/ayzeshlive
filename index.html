<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYZESHLIVE — Scan & Play AR</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#ff6b00" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      overflow-x: hidden;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: #000000;
      border-bottom: 2px solid #ff6b00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 999;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 900;
      color: #ff6b00;
      letter-spacing: 1.5px;
    }
    .brand-sub {
      font-size: 10px;
      color: #9ca3af;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .nav-btn {
      background: #ff6b00;
      color: #000000;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .main-wrap {
      padding-top: 64px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .controls {
      width: 100%;
      max-width: 720px;
      padding: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }
    .ctrl-btn {
      background: #ff6b00;
      color: #000000;
      border: 1px solid #ff6b00;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .ar-box {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 720px;
      height: 76vh;
      min-height: 440px;
      background: #000000;
      border: 1px solid #263147;
      overflow: hidden;
    }
    /* MindAR ke apnay camera video ko box ke andar upar laana */
    .ar-box > video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }
    .ar-box a-scene {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      pointer-events: none;
    }
    .ar-box canvas.a-canvas {
      width: 100% !important;
      height: 100% !important;
      background: transparent !important;
    }
    .video-stage {
      display: none;
      position: absolute;
      inset: 0;
      background: #000000;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .video-stage.show {
      display: flex;
    }
    .video-stage video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }
    .cam-back-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 25;
      background: #ff6b00;
      color: #000000;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }
    .status-bar {
      width: 100%;
      max-width: 720px;
      padding: 10px 14px;
      font-size: 13px;
      color: #d1d5db;
      background: #141b2d;
      border-top: 1px solid #263147;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn-group-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .action-btn {
      background: #ff6b00;
      color: #000000;
      border: none;
      border-radius: 6px;
      padding: 7px 11px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .action-btn.ghost {
      background: #1f2937;
      color: #ffffff;
      border: 1px solid #ff6b00;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="./index.html" class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#000" stroke="#ff6b00" stroke-width="3"/>
        <path d="M18 46 L32 16 L46 46 M23 36 H41" stroke="#ff6b00" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="48" r="4" fill="#fff"/>
      </svg>
      <div>
        <div class="brand-title">AYZESHLIVE</div>
        <div class="brand-sub">Scan & Play AR</div>
      </div>
    </a>
    <a href="./builder.html" class="nav-btn">+ Builder</a>
  </header>

  <div class="main-wrap">
    <div class="controls">
      <button id="scanCameraBtn" class="ctrl-btn" onclick="startScanCamera()">📷 Scan Camera</button>
    </div>

    <div class="ar-box" id="arContainer">
      <a-scene
        id="arScene"
        mindar-image="imageTargetSrc: ./assets/targets1.mind; autoStart: false; uiScanning: no; uiLoading: no;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights, antialias: true, alpha: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="targetsContainer">
          <a-entity id="arTarget0" mindar-image-target="targetIndex: 0"></a-entity>
        </a-entity>
      </a-scene>

      <div id="videoStage" class="video-stage">
        <button class="cam-back-btn" onclick="backToCamera()">✕ Camera</button>
        <video id="stageVideo" playsinline webkit-playsinline loop muted></video>
      </div>
    </div>

    <div class="status-bar">
      <span id="statusText">Click "Scan Camera" to scan target image.</span>
      <div class="btn-group-right">
        <button id="muteBtn" class="action-btn ghost" onclick="toggleMute()">🔇 Unmute</button>
        <button id="playBtn" class="action-btn" onclick="togglePlay()">⏸ Pause</button>
      </div>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const muteBtn = document.getElementById('muteBtn');
    const playBtn = document.getElementById('playBtn');
    const arScene = document.getElementById('arScene');
    const videoStage = document.getElementById('videoStage');
    const stageVideo = document.getElementById('stageVideo');

    let arRunning = false;
    let isStarting = false;
    let scannedVideoUrl = '';

    function syncButtons() {
      muteBtn.innerText = stageVideo.muted ? '🔇 Unmute' : '🔊 Mute';
      playBtn.innerText = stageVideo.paused ? '▶ Play' : '⏸ Pause';
    }

    stageVideo.addEventListener('play', syncButtons);
    stageVideo.addEventListener('pause', syncButtons);
    stageVideo.addEventListener('volumechange', syncButtons);

    function triggerMatchedVideo(videoUrl, label) {
      if (!videoUrl) return;
      scannedVideoUrl = videoUrl;
      if (stageVideo.getAttribute('src') !== videoUrl) {
        stageVideo.setAttribute('src', videoUrl);
        stageVideo.load();
      }
      videoStage.classList.add('show');
      stageVideo.play().catch(() => {});
      statusText.innerText = `Scanned ${label} — playing video.`;
      syncButtons();
    }

    function backToCamera() {
      stageVideo.pause();
      videoStage.classList.remove('show');
      syncButtons();
      statusText.innerText = arRunning
        ? 'Camera ON — point at target image to scan.'
        : 'Click "Scan Camera" to scan target image.';
    }

    arScene.addEventListener('arReady', () => {
      arRunning = true;
      isStarting = false;
      statusText.innerText = 'Camera ON — point at target image to scan.';
    });

    arScene.addEventListener('arError', () => {
      arRunning = false;
      isStarting = false;
      statusText.innerText = 'Camera error: Close other camera tabs/apps, check camera permission, and retry.';
    });

    async function initTargetsConfig() {
      try {
        const res = await fetch('./targets.json', { cache: 'no-store' });
        if (!res.ok) return;
        const cfg = await res.json();

        if (cfg.mindFile) {
          arScene.setAttribute(
            'mindar-image',
            `imageTargetSrc: ${cfg.mindFile}; autoStart: false; uiScanning: no; uiLoading: no;`
          );
        }

        if (Array.isArray(cfg.targets) && cfg.targets.length) {
          const containerEl = document.getElementById('targetsContainer');
          containerEl.innerHTML = '';

          cfg.targets.forEach((t, i) => {
            const idx = typeof t.targetIndex === 'number' ? t.targetIndex : i;
            const ent = document.createElement('a-entity');
            ent.id = `arTarget${idx}`;
            ent.setAttribute('mindar-image-target', `targetIndex: ${idx}`);
            containerEl.appendChild(ent);

            attachTargetEvents(ent, t.videoUrl, t.name || `Target #${idx}`);
          });
        }
      } catch (_) {}
    }

    function attachTargetEvents(targetEl, videoUrlForTarget, label) {
      targetEl.addEventListener('targetFound', () => {
        if (videoUrlForTarget) {
          triggerMatchedVideo(videoUrlForTarget, label);
        }
      });
    }

    attachTargetEvents(document.getElementById('arTarget0'), './assets/jingpeng1.mp4', 'JINPENG-01');
    const targetsReady = initTargetsConfig();

    async function startScanCamera() {
      stageVideo.pause();
      videoStage.classList.remove('show');
      syncButtons();

      if (arRunning) {
        statusText.innerText = 'Camera ON — point at target image to scan.';
        return;
      }
      if (isStarting) return;

      isStarting = true;
      statusText.innerText = 'Starting camera & AR scanner...';

      try {
        await targetsReady;

        if (!arScene.hasLoaded) {
          await new Promise(resolve => arScene.addEventListener('loaded', resolve, { once: true }));
        }

        const arSystem = arScene.systems && arScene.systems['mindar-image-system'];
        if (!arSystem) {
          throw new Error('AR system not ready. Refresh page.');
        }

        await arSystem.start();
      } catch (err) {
        isStarting = false;
        statusText.innerText = 'Camera error: ' + (err && err.message ? err.message : 'Could not start camera.');
      }
    }

    function togglePlay() {
      if (!scannedVideoUrl) {
        statusText.innerText = 'Scan a target image first to play its video.';
        return;
      }
      if (!videoStage.classList.contains('show')) {
        videoStage.classList.add('show');
      }
      if (stageVideo.paused) {
        stageVideo.play().catch(() => {});
      } else {
        stageVideo.pause();
      }
      syncButtons();
    }

    function toggleMute() {
      stageVideo.muted = !stageVideo.muted;
      syncButtons();
    }

    // Tab close/refresh par camera hardware release karna
    function releaseCamera() {
      document.querySelectorAll('video').forEach(v => {
        if (v.srcObject && typeof v.srcObject.getTracks === 'function') {
          v.srcObject.getTracks().forEach(track => track.stop());
          v.srcObject = null;
        }
      });
    }
    window.addEventListener('pagehide', releaseCamera);
    window.addEventListener('beforeunload', releaseCamera);
  </script>
</body>
</html>
