<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYZESHLIVE — Scan & Play AR</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#ff6b00" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      overflow-x: hidden;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: #000000;
      border-bottom: 2px solid #ff6b00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 999;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 900;
      color: #ff6b00;
      letter-spacing: 1.5px;
    }
    .brand-sub {
      font-size: 10px;
      color: #9ca3af;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .nav-btn {
      background: #ff6b00;
      color: #000000;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .main-wrap {
      padding-top: 64px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .controls {
      width: 100%;
      max-width: 720px;
      padding: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }
    .ctrl-btn {
      background: #ff6b00;
      color: #000000;
      border: 1px solid #ff6b00;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .ar-box {
      position: relative;
      width: 100%;
      max-width: 720px;
      height: 76vh;
      min-height: 440px;
      background: #000000;
      border: 1px solid #263147;
      overflow: hidden;
    }
    .ar-box a-scene {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      display: block !important;
      z-index: 2 !important;
    }
    .ar-box > video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 1 !important;
    }
    .ar-box canvas.a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 2 !important;
      background: transparent !important;
    }
    .video-stage {
      display: none;
      position: absolute;
      inset: 0;
      background: #000000;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .video-stage.show {
      display: flex;
    }
    .video-stage video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }
    .cam-back-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 25;
      background: #ff6b00;
      color: #000000;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }
    .status-bar {
      width: 100%;
      max-width: 720px;
      padding: 10px 14px;
      font-size: 13px;
      color: #d1d5db;
      background: #141b2d;
      border-top: 1px solid #263147;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn-group-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .action-btn {
      background: #ff6b00;
      color: #000000;
      border: none;
      border-radius: 6px;
      padding: 7px 11px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .action-btn.ghost {
      background: #1f2937;
      color: #ffffff;
      border: 1px solid #ff6b00;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="./index.html" class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#000" stroke="#ff6b00" stroke-width="3"/>
        <path d="M18 46 L32 16 L46 46 M23 36 H41" stroke="#ff6b00" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="48" r="4" fill="#fff"/>
      </svg>
      <div>
        <div class="brand-title">AYZESHLIVE</div>
        <div class="brand-sub">Scan & Play AR</div>
      </div>
    </a>
    <a href="./builder.html" class="nav-btn">+ Builder</a>
  </header>

  <div class="main-wrap">
    <div class="controls">
      <button id="scanCameraBtn" class="ctrl-btn" onclick="openCameraView()">📷 Scan Camera</button>
    </div>

    <div class="ar-box" id="arContainer">
      <a-scene
        id="arScene"
        mindar-image="imageTargetSrc: ./assets/targets1.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights, antialias: true, alpha: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >
        <a-assets id="arAssets">
          <video
            id="arVideo0"
            src="./assets/jingpeng1.mp4"
            preload="none"
            muted
            playsinline
          ></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="targetsContainer">
          <a-entity id="arTarget0" mindar-image-target="targetIndex: 0">
            <a-plane color="#ff6b00" opacity="0.18" width="1" height="0.6" position="0 0 0"></a-plane>
          </a-entity>
        </a-entity>
      </a-scene>

      <div id="videoStage" class="video-stage">
        <button class="cam-back-btn" onclick="openCameraView()">✕ Camera</button>
        <video id="stageVideo" src="./assets/jingpeng1.mp4" playsinline webkit-playsinline loop muted></video>
      </div>
    </div>

    <div class="status-bar">
      <span id="statusText">Point camera at target image to play video.</span>
      <div class="btn-group-right">
        <button id="muteBtn" class="action-btn ghost" onclick="toggleMute()">🔇 Unmute</button>
        <button id="playBtn" class="action-btn" onclick="togglePlay()">▶ Play</button>
      </div>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const muteBtn = document.getElementById('muteBtn');
    const playBtn = document.getElementById('playBtn');
    const arContainer = document.getElementById('arContainer');
    const arScene = document.getElementById('arScene');
    const videoStage = document.getElementById('videoStage');
    const stageVideo = document.getElementById('stageVideo');

    let currentVideoUrl = './assets/jingpeng1.mp4';

    function silenceBackgroundArVideos() {
      document.querySelectorAll('#arAssets video').forEach((v) => {
        v.muted = true;
        v.pause();
      });
    }

    function syncButtons() {
      muteBtn.innerText = stageVideo.muted ? '🔇 Unmute' : '🔊 Mute';
      playBtn.innerText = stageVideo.paused ? '▶ Play' : '⏸ Pause';
    }

    function syncMindArCameraVideo() {
      document.querySelectorAll('video').forEach((vid) => {
        if (vid.id !== 'stageVideo' && !vid.closest('#arAssets')) {
          if (vid.parentElement !== arContainer) {
            arContainer.insertBefore(vid, videoStage);
          }
          vid.style.position = 'absolute';
          vid.style.top = '0';
          vid.style.left = '0';
          vid.style.width = '100%';
          vid.style.height = '100%';
          vid.style.objectFit = 'cover';
          vid.style.zIndex = '1';
          vid.style.display = 'block';
        }
      });
    }

    arScene.addEventListener('arReady', () => {
      syncMindArCameraVideo();
      statusText.innerText = 'Scan Camera ready — point at target image.';
    });

    arScene.addEventListener('arError', () => {
      statusText.innerText = 'Camera permission required — allow camera in browser.';
    });

    setInterval(syncMindArCameraVideo, 1000);

    stageVideo.addEventListener('loadedmetadata', () => {
      statusText.innerText = `Ready (${stageVideo.videoWidth}x${stageVideo.videoHeight}).`;
    });

    stageVideo.addEventListener('play', syncButtons);
    stageVideo.addEventListener('pause', syncButtons);
    stageVideo.addEventListener('volumechange', syncButtons);

    function showFullVideo(url) {
      silenceBackgroundArVideos();
      if (url && stageVideo.getAttribute('src') !== url) {
        stageVideo.setAttribute('src', url);
        stageVideo.load();
      }
      videoStage.classList.add('show');
      stageVideo.play().catch(() => {});
      syncButtons();
    }

    function openCameraView() {
      stageVideo.pause();
      silenceBackgroundArVideos();
      videoStage.classList.remove('show');
      syncMindArCameraVideo();
      statusText.innerText = 'Scan Camera active — point at target image.';
      syncButtons();
    }

    function togglePlay() {
      silenceBackgroundArVideos();
      if (!videoStage.classList.contains('show')) {
        showFullVideo(currentVideoUrl);
        stageVideo.muted = false;
        stageVideo.play().catch(() => {});
        syncButtons();
        return;
      }

      if (stageVideo.paused) {
        stageVideo.play().catch(() => {});
      } else {
        stageVideo.pause();
      }
      syncButtons();
    }

    function toggleMute() {
      silenceBackgroundArVideos();
      stageVideo.muted = !stageVideo.muted;
      if (!stageVideo.muted && videoStage.classList.contains('show') && stageVideo.paused) {
        stageVideo.play().catch(() => {});
      }
      syncButtons();
    }

    function attachTargetEvents(targetEl, videoUrlForTarget, label) {
      targetEl.addEventListener('targetFound', () => {
        currentVideoUrl = videoUrlForTarget || currentVideoUrl;
        statusText.innerText = `Scanned: ${label} — Playing video...`;
        showFullVideo(currentVideoUrl);
      });

      targetEl.addEventListener('targetLost', () => {
        statusText.innerText = `Target lost (${label}).`;
      });
    }

    attachTargetEvents(document.getElementById('arTarget0'), currentVideoUrl, 'JINPENG-01');

    async function initTargetsConfig() {
      const params = new URLSearchParams(window.location.search);
      const queryVideo = params.get('video');
      const queryTarget = parseInt(params.get('target') || '0', 10);

      if (queryVideo) {
        currentVideoUrl = decodeURIComponent(queryVideo);
        stageVideo.src = currentVideoUrl;
      }

      try {
        const res = await fetch('./targets.json', { cache: 'no-store' });
        if (!res.ok) return;
        const cfg = await res.json();

        if (cfg.mindFile) {
          arScene.setAttribute(
            'mindar-image',
            `imageTargetSrc: ${cfg.mindFile}; autoStart: true; uiScanning: yes; uiLoading: yes;`
          );
        }

        if (Array.isArray(cfg.targets) && cfg.targets.length) {
          const assetsEl = document.getElementById('arAssets');
          const containerEl = document.getElementById('targetsContainer');
          assetsEl.innerHTML = '';
          containerEl.innerHTML = '';

          cfg.targets.forEach((t, i) => {
            const idx = typeof t.targetIndex === 'number' ? t.targetIndex : i;
            const vidId = `arVideo${idx}`;
            const resolvedSrc = (idx === queryTarget && queryVideo)
              ? decodeURIComponent(queryVideo)
              : (t.videoUrl || currentVideoUrl);

            const v = document.createElement('video');
            v.id = vidId;
            v.src = resolvedSrc;
            v.preload = 'none';
            v.muted = true;
            v.playsinline = true;
            assetsEl.appendChild(v);

            const ent = document.createElement('a-entity');
            ent.id = `arTarget${idx}`;
            ent.setAttribute('mindar-image-target', `targetIndex: ${idx}`);

            const marker = document.createElement('a-plane');
            marker.setAttribute('color', '#ff6b00');
            marker.setAttribute('opacity', '0.18');
            marker.setAttribute('width', '1');
            marker.setAttribute('height', '0.6');
            marker.setAttribute('position', '0 0 0');

            ent.appendChild(marker);
            containerEl.appendChild(ent);

            if (idx === 0 || idx === queryTarget) {
              currentVideoUrl = resolvedSrc;
              stageVideo.src = currentVideoUrl;
            }

            attachTargetEvents(ent, resolvedSrc, t.name || `Target #${idx}`);
          });
        }
      } catch (_) {}
    }

    initTargetsConfig();
  </script>
</body>
</html>
