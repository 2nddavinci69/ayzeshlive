<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AYZESHLIVE — Scan & Play AR</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#ff6b00" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      overflow-x: hidden;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 64px;
      background: #000000;
      border-bottom: 2px solid #ff6b00;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 999;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 900;
      color: #ff6b00;
      letter-spacing: 1.5px;
    }
    .brand-sub {
      font-size: 10px;
      color: #9ca3af;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .nav-btn {
      background: #ff6b00;
      color: #000000;
      font-weight: 800;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .main-wrap {
      padding-top: 64px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .controls {
      width: 100%;
      max-width: 720px;
      padding: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      background: #111827;
      border-bottom: 1px solid #1f2937;
    }
    .ctrl-btn {
      background: #141b2d;
      color: #ffffff;
      border: 1px solid #ff6b00;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .ctrl-btn.active {
      background: #ff6b00;
      color: #000000;
    }
    .ar-box {
      position: relative;
      width: 100%;
      max-width: 720px;
      height: 76vh;
      min-height: 440px;
      background: #000000;
      border: 1px solid #263147;
      overflow: hidden;
    }
    .ar-box a-scene,
    .ar-box canvas.a-canvas {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }
    .qr-panel {
      display: none;
      width: 100%;
      max-width: 720px;
      padding: 16px;
      background: #141b2d;
      text-align: center;
    }
    .qr-panel.show { display: block; }
    video#qrVideo {
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      border: 2px solid #ff6b00;
      background: #000;
    }
    .status-bar {
      width: 100%;
      max-width: 720px;
      padding: 10px 14px;
      font-size: 13px;
      color: #d1d5db;
      background: #141b2d;
      border-top: 1px solid #263147;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn-group-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .sound-btn {
      background: #ff6b00;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
    }
    .sound-btn.ghost {
      background: #1f2937;
      color: #ffffff;
      border: 1px solid #ff6b00;
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="./index.html" class="brand">
      <svg width="34" height="34" viewBox="0 0 64 64">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#000" stroke="#ff6b00" stroke-width="3"/>
        <path d="M18 46 L32 16 L46 46 M23 36 H41" stroke="#ff6b00" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="32" cy="48" r="4" fill="#fff"/>
      </svg>
      <div>
        <div class="brand-title">AYZESHLIVE</div>
        <div class="brand-sub">Scan & Play AR</div>
      </div>
    </a>
    <a href="./builder.html" class="nav-btn">+ Builder</a>
  </header>

  <div class="main-wrap">
    <div class="controls">
      <button id="modeArBtn" class="ctrl-btn active" onclick="switchMode('ar')">📷 Image AR Scan</button>
      <button id="modeQrBtn" class="ctrl-btn" onclick="switchMode('qr')">🔳 Direct QR Scan</button>
      <label class="ctrl-btn">
        📁 Load Local Video
        <input type="file" id="localVideoInput" accept="video/mp4,video/*" style="display:none;" onchange="loadLocalVideo(event)" />
      </label>
    </div>

    <div class="ar-box" id="arContainer">
      <a-scene
        id="arScene"
        mindar-image="imageTargetSrc: ./assets/targets1.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights, antialias: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
      >
        <a-assets id="arAssets">
          <video
            id="arVideo0"
            src="./assets/jingpeng1.mp4"
            preload="auto"
            loop="true"
            crossorigin="anonymous"
            playsinline
            webkit-playsinline
            muted
          ></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity id="targetsContainer">
          <a-entity id="arTarget0" mindar-image-target="targetIndex: 0">
            <a-video
              id="arPlane0"
              src="#arVideo0"
              width="1.2"
              height="0.675"
              position="0 0 0.02"
              material="side: double; transparent: false;"
              visible="false"
            ></a-video>
          </a-entity>
        </a-entity>
      </a-scene>
    </div>

    <div class="qr-panel" id="qrPanel">
      <p style="margin-top:0; color:#ff6b00; font-weight:700;">Scan AYZESHLIVE QR Code</p>
      <video id="qrVideo" playsinline></video>
      <canvas id="qrCanvas" style="display:none;"></canvas>
      <p id="qrResult" style="font-size:13px; color:#d1d5db; word-break:break-all;">Waiting for QR code...</p>
    </div>

    <div class="status-bar">
      <span id="statusText">Point camera at target image to play video.</span>
      <div class="btn-group-right">
        <button class="sound-btn ghost" onclick="toggleBoxSize()">⛶ Size</button>
        <button id="soundBtn" class="sound-btn" onclick="toggleSoundOrPlay()">🔊 Unmute / Play</button>
      </div>
    </div>
  </div>

  <script>
    const statusText = document.getElementById('statusText');
    const soundBtn = document.getElementById('soundBtn');
    const arContainer = document.getElementById('arContainer');
    let activeVideoEl = document.getElementById('arVideo0');
    let isTargetDetected = false;
    let tallBox = false;

    function toggleBoxSize() {
      tallBox = !tallBox;
      arContainer.style.height = tallBox ? '86vh' : '76vh';
    }

    function attachTargetEvents(targetEl, planeEl, vidEl, label) {
      planeEl.setAttribute('visible', 'false');
      vidEl.pause();

      targetEl.addEventListener('targetFound', () => {
        isTargetDetected = true;
        activeVideoEl = vidEl;
        planeEl.setAttribute('visible', 'true');
        statusText.innerText = `Detected: ${label} — Playing video...`;
        vidEl.play().catch(() => {});
      });

      targetEl.addEventListener('targetLost', () => {
        isTargetDetected = false;
        planeEl.setAttribute('visible', 'false');
        vidEl.pause();
        statusText.innerText = `Target lost (${label}). Point camera at image again.`;
      });
    }

    attachTargetEvents(
      document.getElementById('arTarget0'),
      document.getElementById('arPlane0'),
      activeVideoEl,
      'JINPENG-01'
    );

    async function initTargetsConfig() {
      const params = new URLSearchParams(window.location.search);
      const queryVideo = params.get('video');
      const queryTarget = parseInt(params.get('target') || '0', 10);

      if (queryVideo) {
        const targetVid = document.getElementById(`arVideo${queryTarget}`) || activeVideoEl;
        targetVid.src = decodeURIComponent(queryVideo);
        activeVideoEl = targetVid;
      }

      try {
        const res = await fetch('./targets.json', { cache: 'no-store' });
        if (!res.ok) return;
        const cfg = await res.json();
        if (cfg.mindFile) {
          document.getElementById('arScene').setAttribute(
            'mindar-image',
            `imageTargetSrc: ${cfg.mindFile}; autoStart: true; uiScanning: yes; uiLoading: yes;`
          );
        }
        if (Array.isArray(cfg.targets) && cfg.targets.length) {
          const assetsEl = document.getElementById('arAssets');
          const containerEl = document.getElementById('targetsContainer');
          assetsEl.innerHTML = '';
          containerEl.innerHTML = '';

          cfg.targets.forEach((t, i) => {
            const idx = typeof t.targetIndex === 'number' ? t.targetIndex : i;
            const vidId = `arVideo${idx}`;
            const planeId = `arPlane${idx}`;

            const v = document.createElement('video');
            v.id = vidId;
            v.src = (idx === queryTarget && queryVideo) ? decodeURIComponent(queryVideo) : t.videoUrl;
            v.preload = 'auto';
            v.loop = true;
            v.crossOrigin = 'anonymous';
            v.playsinline = true;
            v.setAttribute('webkit-playsinline', '');
            v.muted = true;
            assetsEl.appendChild(v);

            const ent = document.createElement('a-entity');
            ent.id = `arTarget${idx}`;
            ent.setAttribute('mindar-image-target', `targetIndex: ${idx}`);

            const plane = document.createElement('a-video');
            plane.id = planeId;
            plane.setAttribute('src', `#${vidId}`);
            plane.setAttribute('width', '1.2');
            plane.setAttribute('height', '0.675');
            plane.setAttribute('position', '0 0 0.02');
            plane.setAttribute('material', 'side: double; transparent: false;');
            plane.setAttribute('visible', 'false');

            ent.appendChild(plane);
            containerEl.appendChild(ent);

            if (idx === 0 || idx === queryTarget) activeVideoEl = v;
            attachTargetEvents(ent, plane, v, t.name || `Target #${idx}`);
          });
        }
      } catch (_) {}
    }

    initTargetsConfig();

    function toggleSoundOrPlay() {
      if (!activeVideoEl) return;

      if (activeVideoEl.muted) {
        activeVideoEl.muted = false;
        activeVideoEl.play().catch(() => {});
        soundBtn.innerText = '⏸ Pause / Mute';
        statusText.innerText = 'Sound enabled & playing.';
        return;
      }

      if (activeVideoEl.paused) {
        activeVideoEl.play().catch(() => {});
        soundBtn.innerText = '⏸ Pause';
        statusText.innerText = 'Video playing.';
      } else {
        activeVideoEl.pause();
        soundBtn.innerText = '▶ Play';
        statusText.innerText = 'Video paused.';
      }
    }

    function loadLocalVideo(e) {
      const file = e.target.files[0];
      if (!file || !activeVideoEl) return;
      activeVideoEl.src = URL.createObjectURL(file);
      activeVideoEl.load();
      statusText.innerText = 'Loaded local video: ' + file.name;
    }

    let qrStream = null;
    let qrLoopId = null;

    function switchMode(mode) {
      const qrPanel = document.getElementById('qrPanel');
      const modeArBtn = document.getElementById('modeArBtn');
      const modeQrBtn = document.getElementById('modeQrBtn');

      if (mode === 'qr') {
        activeVideoEl.pause();
        arContainer.style.display = 'none';
        qrPanel.classList.add('show');
        modeQrBtn.classList.add('active');
        modeArBtn.classList.remove('active');
        startQrScan();
      } else {
        stopQrScan();
        qrPanel.classList.remove('show');
        arContainer.style.display = 'block';
        modeArBtn.classList.add('active');
        modeQrBtn.classList.remove('active');
        if (isTargetDetected) {
          activeVideoEl.play().catch(() => {});
        }
      }
    }

    async function startQrScan() {
      const qrVideo = document.getElementById('qrVideo');
      const qrCanvas = document.getElementById('qrCanvas');
      const ctx = qrCanvas.getContext('2d');
      const qrResult = document.getElementById('qrResult');

      try {
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        qrVideo.srcObject = qrStream;
        await qrVideo.play();

        function scanFrame() {
          if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
            qrCanvas.width = qrVideo.videoWidth;
            qrCanvas.height = qrVideo.videoHeight;
            ctx.drawImage(qrVideo, 0, 0, qrCanvas.width, qrCanvas.height);
            const imgData = ctx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height);
            if (code && code.data) {
              qrResult.innerHTML = 'QR Found: <a href="' + code.data + '" style="color:#ff6b00;">' + code.data + '</a>';
              if (code.data.startsWith('http')) {
                stopQrScan();
                window.location.href = code.data;
                return;
              }
            }
          }
          qrLoopId = requestAnimationFrame(scanFrame);
        }
        qrLoopId = requestAnimationFrame(scanFrame);
      } catch (err) {
        qrResult.innerText = 'Camera error: ' + err.message;
      }
    }

    function stopQrScan() {
      if (qrLoopId) cancelAnimationFrame(qrLoopId);
      if (qrStream) {
        qrStream.getTracks().forEach(t => t.stop());
        qrStream = null;
      }
    }
  </script>
</body>
</html>
