<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AYZESHLIVE — Scan Verification</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0b0f19;
      color: #ffffff;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .header {
      width: 100%;
      background: #000000;
      border-bottom: 2px solid #ff6b00;
      padding: 14px 0;
      text-align: center;
      position: sticky;
      top: 0;
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      color: #ff6b00;
      letter-spacing: 2px;
    }
    .card {
      width: 90%;
      max-width: 420px;
      margin: 28px auto;
      background: #141b2d;
      border: 1px solid #263147;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    .badge { font-size: 46px; margin-bottom: 8px; }
    .title { font-size: 20px; font-weight: 800; margin-bottom: 8px; color: #10b981; }
    .box {
      background: #0b0f19;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 14px;
      margin: 18px 0;
      text-align: left;
      font-size: 14px;
    }
    .box strong { color: #ff6b00; }
    .btn-play {
      display: block;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff6b00, #e65100);
      color: #000;
      font-weight: 900;
      text-decoration: none;
      border-radius: 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">AYZESHLIVE</div>
  </div>

  <div class="card">
    <div class="badge">✅</div>
    <div class="title">AYZESHLIVE PASS READY</div>
    <p style="font-size:13px; color:#9ca3af;">Code verified. Launch camera to scan target image and play video.</p>
    <div class="box">
      <p><strong>Code ID:</strong> <span id="codeId">AYZ-001</span></p>
      <p><strong>Scans on Device:</strong> <span id="scanCount">1</span></p>
      <p><strong>Time:</strong> <span id="scanTime">---</span></p>
    </div>
    <a id="launchLink" href="./index.html" class="btn-play">▶ Launch Scan & Play</a>
  </div>

  <script>
    const q = new URLSearchParams(window.location.search);
    const id = q.get('id') || 'AYZ-001';
    const key = 'ayzeshlive_scan_' + id;
    const now = new Date().toLocaleString();
    let rec = JSON.parse(localStorage.getItem(key)) || { count: 0, first: now };
    rec.count += 1;
    localStorage.setItem(key, JSON.stringify(rec));

    document.getElementById('codeId').innerText = id;
    document.getElementById('scanCount').innerText = rec.count;
    document.getElementById('scanTime').innerText = rec.first;
    if (q.get('video')) {
      document.getElementById('launchLink').href = './index.html?video=' + encodeURIComponent(q.get('video'));
    }
  </script>
</body>
</html>
